    <div class="quick-lookup-main-container">
        <div class="quick-lookup-parent-container" data-name={parent} tabindex="0" onblur={handleBlur}>
            <div class="search-container-parent">
                <div class="input-section slds-form-element__control" onblur={handleWrapperBlur} tabindex="0">
                    <lightning-input
                        class="input-parent"
                        name="search-parent-record"
                        label={label}
                        placeholder={placeHolder}
                        type="search"
                        onchange={handleChange}
                        value={defaultVal}>
                    </lightning-input>
                </div>
                <div if:true={showParentOption} class="result-section">
                    <c-quick-lookup-input-c-m-p search-result={searchResult} container-name="quick-lookup-parent-container" onselected_value={handleSelectedParent} onshow_result={handleParentShow}></c-quick-lookup-input-c-m-p>
                </div>
            </div>
        </div>
        <div class="quick-lookup-child-container" data-name={child} tabindex="0" onblur={handleBlur}>
            <div class="search-container-child">
                <div class="input-section">
                    <lightning-input
                        name="search-child-record"
                        label={childlabel}
                        placeholder={placeHolder}
                        type="search"
                        onchange={handleChange}
                        value={defaultChildVal}
                        onfocus={showPickListOptions}>
                    </lightning-input>
                </div>
                <div if:true={showChildOption} class="result-section">
                    <c-quick-lookup-input-c-m-p search-result={searchResultChildFiltered} container-name="quick-lookup-child-container" onselected_value={handleSelectedChild} onshow_result={handleChildShow}></c-quick-lookup-input-c-m-p>
                </div>
            </div>
        </div>
    </div>
</template>
