<template>
    <div class="result-section slds-is-relative" tabindex="0">
        <div class="search-result slds-dropdown slds-dropdown_length-5 slds-dropdown_fluid" role="listbox">
            <ul class="slds-listbox slds-listbox_vertical" role="presentation">
                <template for:each={searchResult} for:item="result">
                    <li key={result.value} role="presentation" data-id={result.uniqueId} onclick={selectSearchResult} class="slds-listbox__item" >
                        <div class="slds-media slds-listbox__option slds-listbox__option_plain slds-media_small" role="option">
                            <span class="slds-media__body">
                                <span class="slds-truncate" title={result.label}>{result.label}</span>
                            </span>
                        </div>
                    </li>
                </template>
            </ul>
        </div>
    </div>
</template>
